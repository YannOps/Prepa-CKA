# Durcissement SSH du lab CKA (bastion et noeuds). Lu avant 50-cloud-init.conf : la premiere valeur l'emporte.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
AllowUsers ubuntu
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
# AllowTcpForwarding reste actif : indispensable au ProxyJump via le bastion
